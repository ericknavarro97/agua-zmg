# Aplica db/migrations/*.sql a la base de PRODUCCIÓN (Neon) cuando la CI de un push a main termina en verde.
# Vercel despliega por su cuenta y no migra: sin esto, el código nuevo puede llegar a una base vieja
# (pasó con 008_nivel_limpia.sql: los reportes «Limpia» respondían 500).
# Espera a la CI para que una migración que rompe las pruebas nunca llegue a producción. A cambio, Vercel suele
# desplegar antes que esto: cada migración debe ser compatible con el código anterior Y con el nuevo (CONTRIBUTING.md).
# El migrador es idempotente (schema_migrations), así que correrlo en cada push no repite nada.
name: Migraciones en producción

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Para reintentar a mano desde la pestaña Actions
  workflow_dispatch:

# Una sola migración a la vez y nunca se cancela a la mitad (ci.yml sí cancela corridas viejas)
concurrency:
  group: migraciones-produccion
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrar:
    name: Migrar base de producción
    # Solo si la CI pasó y fue de un push a main (no de un pull request cuya rama se llame main)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # Cadena DIRECTA de Neon (sin -pooler), con ?sslmode=require
      DATABASE_URL: ${{ secrets.DATABASE_URL_PRODUCCION }}

    defaults:
      run:
        working-directory: web

    steps:
      # Antes del checkout web/ no existe: este paso corre en la raíz
      - name: Revisar secreto
        working-directory: .
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Falta el secreto DATABASE_URL_PRODUCCION (cadena directa de Neon). Ver docs/DEPLOY.md §1.6."
            exit 1
          fi

      # El commit que pasó la CI (workflow_run corre con el workflow de main, no necesariamente ese commit)
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      # Se llama a tsx directo: `pnpm migrate` lee .env.local, que no existe en CI
      - name: Aplicar migraciones pendientes
        run: pnpm exec tsx scripts/migrate.ts
